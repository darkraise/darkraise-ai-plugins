name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - dr-forge
        - dr-status
        - dcc-darkraise-ui
        - dcc-darkraise-win32ui
        - New plugin
        - Marketplace or catalog
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
