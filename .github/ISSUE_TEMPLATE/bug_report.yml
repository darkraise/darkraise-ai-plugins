name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - dr-forge
        - dr-status
        - darkraise-ui
        - darkraise-win32ui
        - Marketplace or catalog
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Shown by `/plugin` in Claude Code or `codex plugin list`.
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Claude Code (terminal)
        - Claude Code (desktop app)
        - Claude Code (IDE extension)
        - Codex
    validations:
      required: true
  - type: input
    id: client-version
    attributes:
      label: Client version
      description: Output of `claude --version` or `codex --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example Ubuntu 24.04, macOS 15, Windows 11 with Git Bash.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Remove tokens, webhook URLs and API keys first.
      render: text
