name: Validate marketplace

on:
  pull_request:

jobs:
  probe:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Probe Git Bash
        timeout-minutes: 5
        shell: pwsh
        run: '& "C:/Program Files/Git/bin/bash.exe" .github/probe.sh'
