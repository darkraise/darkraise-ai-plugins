name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install validation prerequisites
        timeout-minutes: 3
        run: |
          timeout 120s sudo apt-get update
          timeout 60s sudo apt-get install -y jq ripgrep coreutils

      - name: Validate marketplace and plugins
        timeout-minutes: 3
        run: |
          timeout 90s npx --yes @anthropic-ai/claude-code@2.1.306 plugin validate .
          for plugin in dr-status darkraise-ui darkraise-win32ui; do
            timeout 30s npx --yes @anthropic-ai/claude-code@2.1.306 plugin validate "plugins/$plugin"
          done

      # One CLI version for every validate step: dforge's mod (hooks modules)
      # needs 2.1.299, and the marketplace step reads dforge too.
      - name: Validate and test dforge
        timeout-minutes: 3
        run: |
          timeout 60s npx --yes @anthropic-ai/claude-code@2.1.306 plugin validate plugins/dforge
          timeout 90s npx --yes @anthropic-ai/claude-code@2.1.306 plugin test plugins/dforge

      - name: Run maintained regression suites
        timeout-minutes: 12
        run: timeout --kill-after=10s 690s node scripts/test-all.mjs

  windows:
    name: Windows (${{ matrix.shard }}/8)
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install shell prerequisites
        timeout-minutes: 3
        shell: pwsh
        run: choco install jq ripgrep --yes --no-progress
      - name: Run Windows regression suites
        timeout-minutes: 20
        shell: pwsh
        env:
          DR_TEST_BASH: C:/Program Files/Git/bin/bash.exe
          # Git Bash's ln -s copies its target unless told to make a real link,
          # which the runner's administrator account may create.
          MSYS: winsymlinks:nativestrict
        run: node scripts/test-all.mjs --shard ${{ matrix.shard }}/8
