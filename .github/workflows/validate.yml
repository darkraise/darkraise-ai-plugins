name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "homelab: ghr's runner, falling back to GitHub's; hosted: GitHub's"
        type: choice
        options: [homelab, hosted]
        default: homelab

permissions:
  contents: read

jobs:
  # validate runs on ghr's homelab runner, except in a dispatched fallback run
  # and a fork's pull request: ghr refuses fork jobs, which would run their
  # code on the homelab host. The two conditions below must stay the same.
  # ghr starts a runner only once it sees a queued job, and GitHub cannot
  # withdraw a queued job. If ghr has not started validate after five minutes,
  # this dispatches the workflow again on GitHub's runners and cancels the run.
  homelab:
    name: Wait for the homelab runner
    if: ${{ inputs.runner != 'hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status=$(timeout 30s gh api "$jobs" --jq '.jobs[] | select(.name == "validate") | .status' || true)
            if [ -n "$status" ] && [ "$status" != queued ] && [ "$status" != waiting ] && [ "$status" != pending ]; then
              echo "The homelab runner took validate ($status)."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::No homelab runner took validate in five minutes; running again on GitHub's runners."
          timeout 30s gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" -f runner=hosted
          timeout 30s gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY"

  validate:
    timeout-minutes: 26
    runs-on: ${{ fromJSON((inputs.runner != 'hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","linux","homelab"]' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # A self-hosted runner may hold the tools already and have no sudo.
      - name: Install validation prerequisites
        timeout-minutes: 3
        run: |
          missing=()
          command -v jq > /dev/null || missing+=(jq)
          command -v rg > /dev/null || missing+=(ripgrep)
          command -v timeout > /dev/null || missing+=(coreutils)
          if [ "${#missing[@]}" -gt 0 ]; then
            timeout 120s sudo apt-get update
            timeout 60s sudo apt-get install -y "${missing[@]}"
          fi

      # One CLI version for every validate step: dforge's mod (hooks modules)
      # needs 2.1.299, and the marketplace step reads dforge too. Installed
      # once, retried, since an npx download per call ran past its bound;
      # kept off PATH, where test-all would run the cockpit tests again.
      - name: Install Claude Code
        timeout-minutes: 6
        run: |
          for attempt in 1 2 3; do
            timeout 120s npm install --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund @anthropic-ai/claude-code@2.1.306 && break
            [ "$attempt" -lt 3 ] || exit 1
          done
          # The package's postinstall links its native binary; an npm that
          # holds install scripts back for approval would skip it.
          (cd "$RUNNER_TEMP/claude-code" && timeout 60s node node_modules/@anthropic-ai/claude-code/install.cjs)
          timeout 30s "$RUNNER_TEMP/claude-code/node_modules/.bin/claude" --version
          echo "CLAUDE=$RUNNER_TEMP/claude-code/node_modules/.bin/claude" >> "$GITHUB_ENV"

      - name: Validate marketplace and plugins
        timeout-minutes: 3
        run: |
          timeout 60s "$CLAUDE" plugin validate .
          for plugin in dr-status darkraise-ui darkraise-win32ui; do
            timeout 30s "$CLAUDE" plugin validate "plugins/$plugin"
          done

      # The cockpit's 397 tests took 51 to 81 s on the runner, an npx
      # download included.
      - name: Validate and test dforge
        timeout-minutes: 6
        run: |
          timeout 60s "$CLAUDE" plugin validate plugins/dforge
          timeout 240s "$CLAUDE" plugin test plugins/dforge

      # On GitHub's runner, which a fallback run uses, the suites outgrew 690 s
      # on 2026-10-26; the homelab runner takes about two thirds as long.
      - name: Run maintained regression suites
        timeout-minutes: 18
        run: timeout --kill-after=10s 1050s node scripts/test-all.mjs

  windows:
    name: Windows (${{ matrix.shard }}/8)
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install shell prerequisites
        timeout-minutes: 3
        shell: pwsh
        run: choco install jq ripgrep --yes --no-progress
      - name: Run Windows regression suites
        timeout-minutes: 20
        shell: pwsh
        env:
          DR_TEST_BASH: C:/Program Files/Git/bin/bash.exe
          # Git Bash's ln -s copies its target unless told to make a real link,
          # which the runner's administrator account may create.
          MSYS: winsymlinks:nativestrict
        run: node scripts/test-all.mjs --shard ${{ matrix.shard }}/8
