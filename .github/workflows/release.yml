name: Release

on:
  # validate.yml's full run dispatches this with the commit it validated. A
  # manual dispatch without `validated` releases main as it is, bypassing the
  # full run: it completes the releases of a run that pushed its tags and then
  # failed.
  workflow_dispatch:
    inputs:
      validated:
        description: the commit a full validate run passed
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # The push uses GITHUB_TOKEN, so the release commit starts no workflow.
      - name: Release changed plugins
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED: ${{ inputs.validated }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          timeout 300s node scripts/release.mjs ${VALIDATED:+--validated "$VALIDATED"}
